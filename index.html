<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Algorithm Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .neon-text-cyan {
            text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #fde047, 0 0 10px #fde047;
        }
        .neon-border {
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.3), inset 0 0 10px rgba(34, 211, 238, 0.2);
            border-color: #22d3ee;
        }

        .board-grid {
            display: grid;
            gap: 4px;
            background-color: #1e293b;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #334155;
            grid-template-columns: repeat(8, 1fr);
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: #0f172a;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        @media (min-width: 768px) {
            .cell {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }

        .robot {
            transition: transform 0.3s ease;
        }

        .arcade-btn {
            transition: all 0.1s ease;
        }
        .arcade-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .arcade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-bold text-cyan-400 neon-text-cyan mb-2">NEON ROBO-ROUTE</h1>
        <p class="text-gray-400">Program the robot to reach the green portal!</p>
    </header>

    <div class="max-w-4xl w-full flex flex-col md:flex-row gap-8 items-start justify-center">
        
        <!-- Game Board Section -->
        <div class="flex flex-col items-center">
            <h2 class="text-xl mb-4 text-purple-400 font-bold">STAGE <span id="level-indicator">1</span></h2>
            <div id="board" class="board-grid neon-border"></div>
        </div>

        <!-- Controls Section -->
        <div class="flex-1 w-full flex flex-col gap-6 bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-xl">
            
            <!-- Message Box -->
            <div id="message-box" class="text-center text-lg md:text-xl font-bold h-8 text-cyan-400 mb-4 flex items-center justify-center">
                SYSTEM READY. AWAITING INPUT.
            </div>

            <div class="grid grid-cols-3 gap-3">
                <button onclick="addCommand('turn-left')" class="arcade-btn bg-purple-600 hover:bg-purple-500 text-white py-3 rounded border-b-4 border-purple-800 font-bold flex flex-col items-center">
                    <span class="text-2xl mb-1">↺</span>
                    <span class="text-xs">LEFT</span>
                </button>
                <button onclick="addCommand('forward')" class="arcade-btn bg-cyan-500 hover:bg-cyan-400 text-slate-900 py-3 rounded border-b-4 border-cyan-700 font-bold flex flex-col items-center">
                    <span class="text-2xl mb-1">⬆️</span>
                    <span class="text-xs">FORWARD</span>
                </button>
                <button onclick="addCommand('turn-right')" class="arcade-btn bg-purple-600 hover:bg-purple-500 text-white py-3 rounded border-b-4 border-purple-800 font-bold flex flex-col items-center">
                    <span class="text-2xl mb-1">↻</span>
                    <span class="text-xs">RIGHT</span>
                </button>
            </div>

            <!-- Command Queue Display -->
            <div class="bg-slate-900 border-2 border-slate-700 p-4 rounded min-h-[100px]">
                <p class="text-xs text-gray-500 mb-2 font-bold">MEMORY BUFFER (MAX 15):</p>
                <div id="command-queue" class="flex flex-wrap gap-2"></div>
                <div id="empty-queue-text" class="text-gray-600 italic text-sm text-center mt-2">Buffer Empty</div>
            </div>

            <div class="flex gap-4">
                <button onclick="clearCommands()" class="arcade-btn flex-1 bg-rose-600 hover:bg-rose-500 text-white py-3 rounded font-bold border-b-4 border-rose-800">
                    CLEAR
                </button>
                <button id="run-btn" onclick="runAlgorithm()" class="arcade-btn flex-1 bg-green-500 hover:bg-green-400 text-slate-900 py-3 rounded font-bold border-b-4 border-green-700">
                    EXECUTE
                </button>
            </div>
        </div>
    </div>

    <script>
        // Simple Web Audio API sound generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const playTone = (freq, type, duration) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        };

        const sounds = {
            click: () => playTone(600, 'sine', 0.05),
            move: () => playTone(300, 'square', 0.1),
            turn: () => playTone(400, 'triangle', 0.1),
            win: () => { 
                playTone(500, 'sine', 0.1); 
                setTimeout(() => playTone(700, 'sine', 0.2), 100); 
            },
            lose: () => playTone(150, 'sawtooth', 0.4)
        };

        const gridSize = 8;
        const maxCommands = 15;
        let commands = [];
        let isRunning = false;
        let currentLevelIndex = 0;
        
        let robot = { x: 0, y: 0, dir: 0 }; // dir: 0=Right, 1=Down, 2=Left, 3=Up

        const levels = [
            { 
                start: {x: 1, y: 1, dir: 0}, 
                goal: {x: 6, y: 1}, 
                walls: [{x: 4, y: 2}, {x: 4, y: 0}] 
            },
            { 
                start: {x: 1, y: 1, dir: 1}, 
                goal: {x: 5, y: 5}, 
                walls: [{x: 1, y: 3}, {x: 2, y: 3}, {x: 3, y: 3}, {x: 5, y: 3}] 
            },
            { 
                start: {x: 0, y: 7, dir: 0}, 
                goal: {x: 7, y: 0}, 
                walls: [{x: 2, y: 7}, {x: 2, y: 6}, {x: 2, y: 5}, {x: 4, y: 0}, {x: 4, y: 1}, {x: 4, y: 2}, {x: 4, y: 3}, {x: 6, y: 7}, {x: 6, y: 6}] 
            }
        ];

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            const level = levels[currentLevelIndex];

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    // Check for walls
                    if (level.walls.some(w => w.x === x && w.y === y)) {
                        cell.innerText = '🟥'; // Laser wall
                        cell.style.borderColor = '#ef4444';
                        cell.style.boxShadow = 'inset 0 0 5px rgba(239, 68, 68, 0.5)';
                    }
                    // Check for goal
                    else if (level.goal.x === x && level.goal.y === y) {
                        cell.innerText = '🟩'; // Portal
                        cell.style.borderColor = '#22c55e';
                        cell.style.boxShadow = '0 0 10px rgba(34, 197, 94, 0.5), inset 0 0 10px rgba(34, 197, 94, 0.5)';
                    }

                    // Render robot
                    if (robot.x === x && robot.y === y) {
                        const botEl = document.createElement('div');
                        botEl.innerText = '🤖';
                        botEl.className = 'robot';
                        // Rotate based on direction
                        const rotation = robot.dir * 90;
                        botEl.style.transform = `rotate(${rotation}deg)`;
                        cell.appendChild(botEl);
                    }

                    board.appendChild(cell);
                }
            }
        }

        function initLevel() {
            const level = levels[currentLevelIndex];
            robot = { ...level.start };
            commands = [];
            isRunning = false;
            
            document.getElementById('level-indicator').innerText = currentLevelIndex + 1;
            document.getElementById('run-btn').disabled = false;
            
            updateCommandUI();
            renderBoard();
            showMessage(`STAGE ${currentLevelIndex + 1} LOADED. AWAITING INPUT.`, "text-cyan-400");
        }

        function addCommand(cmd) {
            if (isRunning || commands.length >= maxCommands) return;
            sounds.click();
            commands.push(cmd);
            updateCommandUI();
        }

        function clearCommands() {
            if (isRunning) return;
            sounds.click();
            commands = [];
            updateCommandUI();
        }

        function updateCommandUI() {
            const queue = document.getElementById('command-queue');
            const emptyText = document.getElementById('empty-queue-text');
            queue.innerHTML = '';
            
            if (commands.length === 0) {
                emptyText.style.display = 'block';
            } else {
                emptyText.style.display = 'none';
                commands.forEach((cmd, index) => {
                    const cmdEl = document.createElement('span');
                    let icon = '';
                    let styles = '';
                    
                    if (cmd === 'forward') { icon = '⬆️'; styles = 'bg-cyan-500 text-black border-cyan-300'; }
                    if (cmd === 'turn-left') { icon = '↺'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    if (cmd === 'turn-right') { icon = '↻'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    
                    cmdEl.className = `px-2 py-1 rounded border-2 font-bold text-sm ${styles} shadow-md`;
                    cmdEl.innerText = `${icon}`;
                    queue.appendChild(cmdEl);
                });
            }
        }

        function showMessage(msg, colorClass) {
            const msgBox = document.getElementById('message-box');
            msgBox.className = `text-center text-sm md:text-xl font-bold h-8 mb-4 flex items-center justify-center ${colorClass}`;
            msgBox.innerText = msg;
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function resetLevelWithDelay(message) {
            sounds.lose();
            showMessage(message, "text-red-500");
            await delay(1500); 
            initLevel();       
        }

        async function runAlgorithm() {
            if (isRunning || commands.length === 0) return;
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            showMessage(">> EXECUTING PROGRAM...", "text-cyan-400 neon-text-cyan");

            const level = levels[currentLevelIndex];
            
            robot = { ...level.start };
            renderBoard();
            await delay(500);

            for (let i = 0; i < commands.length; i++) {
                const cmd = commands[i];
                
                if (cmd === 'forward') {
                    let nextX = robot.x;
                    let nextY = robot.y;
                    
                    if (robot.dir === 0) nextX++; 
                    if (robot.dir === 1) nextY++; 
                    if (robot.dir === 2) nextX--; 
                    if (robot.dir === 3) nextY--; 

                    // Check boundaries
                    if (nextX < 0 || nextX >= gridSize || nextY < 0 || nextY >= gridSize) {
                        renderBoard();
                        await resetLevelWithDelay("GAME OVER! OUT OF BOUNDS!");
                        document.getElementById('run-btn').disabled = false;
                        return;
                    }

                    // Check walls
                    const isWall = level.walls.some(w => w.x === nextX && w.y === nextY);
                    if (isWall) {
                        renderBoard();
                        await resetLevelWithDelay("CRASH! HIT A LASER WALL!");
                        document.getElementById('run-btn').disabled = false;
                        return;
                    }

                    robot.x = nextX;
                    robot.y = nextY;
                    sounds.move();

                } else if (cmd === 'turn-left') {
                    robot.dir = (robot.dir + 3) % 4; 
                    sounds.turn();
                } else if (cmd === 'turn-right') {
                    robot.dir = (robot.dir + 1) % 4; 
                    sounds.turn();
                }

                renderBoard();
                await delay(500); // Wait between moves
            }

            // Final check to see if we landed on the goal
            if (robot.x === level.goal.x && robot.y === level.goal.y) {
                sounds.win();
                showMessage("MISSION ACCOMPLISHED! 🎉", "text-green-400");
                await delay(2000);
                
                // Progress to next level or win game
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    initLevel();
                } else {
                    showMessage("🏆 YOU WIN! ALL STAGES CLEARED!", "text-yellow-300 neon-text-yellow");
                    isRunning = false;
                    // Intentionally leaving 'run-btn' disabled since game is won
                    return;
                }
            } else {
                await resetLevelWithDelay("MISSION FAILED! GOAL NOT REACHED!");
            }
            
            document.getElementById('run-btn').disabled = false;
        }

        // Start the game
        window.onload = () => {
            initLevel();
        };
    </script>
</body>
</html>
